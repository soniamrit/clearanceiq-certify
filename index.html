function Assessment({onDone}){
  const [cur,setCur]=useState(0);
  const [ans,setAns]=useState({});
  const top=useRef();
  useEffect(()=>{top.current&&top.current.scrollIntoView({behavior:'smooth',block:'start'});},[cur]);
  const q=QUESTIONS[cur];
  const sel=ans[q.id];
  const letters=['A','B','C','D'];
  const choose=(i)=>setAns(a=>({...a,[q.id]:i}));
  const next=()=>{
    if(window.trackEvent)window.trackEvent(cur===0?'assessment_started':'question_answered',{q:cur+1});
    if(cur<QUESTIONS.length-1){setCur(c=>c+1);}else{onDone(ans);}
  };
  return(
    <div className="ap" ref={top}>
      <div className="aprog">
        <div className="apr-row">
          <span className="apr-d">{q.icon} {q.area}</span>
          <span className="apr-c">Question {cur+1} of {QUESTIONS.length}</span>
        </div>
        <div className="apr-t"><div className="apr-f" style={{width:`${Math.round(cur/QUESTIONS.length*100)}%`}}/></div>
        <div className="apr-dots">{QUESTIONS.map((_,i)=><div key={i} className={`adot ${i<cur?'done':i===cur?'active':''}`}/>)}</div>
      </div>
      <div className="aqo">
        <div className="aqc">
          <div className="aqh">
            <span className="atag">{q.area}</span>
            <span className={`apri ${q.weight}`}>{q.weight} PRIORITY</span>
          </div>
          <span className="aico">{q.icon}</span>
          <div className="aqt">{q.q}</div>
          <div className="aopts">
            {q.opts.map((o,i)=>(
              <div key={i} className={`aopt ${sel===i?'sel':''}`} onClick={()=>choose(i)}>
                <div className="abadge">{sel===i?'✓':letters[i]}</div>
                <div className="atxt">{o}</div>
              </div>
            ))}
          </div>
          <div className="afooter">
            {cur>0?<button className="abtn-b" onClick={()=>setCur(c=>c-1)}>← Back</button>:<div/>}
            <button className="abtn-n" onClick={next} disabled={sel===undefined}>
              {cur<QUESTIONS.length-1?'Next Question →':'View My Score →'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Results({ans,onBack}){
  const [email,setEmail]=useState('');
  const [sent,setSent]=useState(false);
  const raw=QUESTIONS.reduce((s,q)=>{const a=ans[q.id];return s+(a!==undefined?q.scores[a]:0);},0);
  const mx=QUESTIONS.reduce((s,q)=>s+Math.max(...q.scores),0);
  const pct=Math.round((raw/mx)*100);
  const level=LEVELS.find(l=>pct>=l.min&&pct<=l.max)||LEVELS[0];

  useEffect(()=>{
    if(window.trackEvent)window.trackEvent('assessment_completed',{score_pct:pct,score_bucket:level.label});
    if(window.FORMSPREE_SCORES){
      fetch("https://formspree.io/f/"+window.FORMSPREE_SCORES,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({score_pct:pct,score_bucket:level.label,completed_at:new Date().toISOString(),_subject:"Assessment — Score: "+pct+"%"})
      }).catch(()=>{});
    }
  },[]);

  const submit=()=>{
    if(!email.includes('@'))return;
    if(window.trackEvent)window.trackEvent('lead_submitted',{score_bucket:level.label});
    if(window.FORMSPREE_LEADS){
      fetch("https://formspree.io/f/"+window.FORMSPREE_LEADS,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email,score_pct:pct,score_bucket:level.label,submitted_at:new Date().toISOString(),_subject:"New Lead: "+email+" — "+pct+"%",_replyto:email})
      }).catch(()=>{});
    }
    setSent(true);
  };

  const areaData=QUESTIONS.map(q=>{
    const a=ans[q.id];
    const p=a!==undefined?Math.round((q.scores[a]/Math.max(...q.scores))*100):0;
    const c=p>=67?'#059669':p>=34?'#D97706':'#DC2626';
    return{q,p,c};
  });

  const C2=2*Math.PI*70;
  const dash=C2*(pct/100);

  return(
    <div className="rp">
      <div className="ri">
        <div className="rshero">
          <div className="rsub">Your CMMC Phase 1 Readiness Score</div>
          <div className="rring">
            <svg width="180" height="180" viewBox="0 0 180 180">
              <circle cx="90" cy="90" r="70" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="14"/>
              <circle cx="90" cy="90" r="70" fill="none" stroke={level.color} strokeWidth="14"
